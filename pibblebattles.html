    <img id="swordImg" style="display:none;" data-html-import-id="html-import-18" data-template-id="img-10" class="canva-image" src="https://www.pngmart.com/files/1/Transparent-Sword-Clip-Art-PNG.png">

    <script data-html-import-id="html-import-19">
        const canvas = document.getElementById('arena');
        const ctx = canvas.getContext('2d');

        // References to configuration controls
        const speedInput = document.getElementById('imgSpeed');
        const sizeInput = document.getElementById('imgSize');
        const hpInput = document.getElementById('maxHp');
        const spawnBtn = document.getElementById('spawnBtn');
        const clearBtn = document.getElementById('clearBtn');

        // Assets
        const charImg = document.getElementById('charImg');
        const swordImg = document.getElementById('swordImg');

        let characters = [];

function getRandomColor() {
  const letters = '19ABCDEF'; // keep it somewhat bright
  let color = '#';
  for (let i = 0; i < 6; i++) {
    // Multiply by 8 because there are only 8 characters in the string
    color += letters[Math.floor(Math.random() * 8)]; 
  }
  return color;
}

        // Character Class
        class Character {
            constructor(x, y, speed, size, maxHp) {
                this.id = Math.random();
                this.x = x;
                this.y = y;
                this.radius = size;
                this.maxHp = maxHp;
                this.hp = maxHp;
                this.color = getRandomColor();
                
                // Random movement direction configuration
                const angle = Math.random() * Math.PI * 2;
                this.vx = Math.cos(angle) * speed;
                this.vy = Math.sin(angle) * speed;

                // Sword configurations scaled with character size
                this.swordAngle = Math.random() * Math.PI * 2;
                this.swordSpinSpeed = 0.05; 
                this.swordRadius = this.radius * 1.5; // Orbit distance
                this.swordWidth = this.radius * 0.4;
                this.swordHeight = this.radius * 1.2;

                // Invulnerability window frame tracker to prevent instant overlapping tick deaths
                this.invulnFrames = 0;
            }

            update() {
                // Diminish invulnerability frames
                if (this.invulnFrames > 0) this.invulnFrames--;

                // Move character
                this.x += this.vx;
                this.y += this.vy;

                // Orbit sword
                this.swordAngle += this.swordSpinSpeed;

                // Screen edge collisions (Bounce)
                if (this.x - this.radius < 0) {
                    this.x = this.radius;
                    this.vx *= -1;
                }
                if (this.x + this.radius > canvas.width) {
                    this.x = canvas.width - this.radius;
                    this.vx *= -1;
                }
                if (this.y - this.radius < 0) {
                    this.y = this.radius;
                    this.vy *= -1;
                }
                if (this.y + this.radius > canvas.height) {
                    this.y = canvas.height - this.radius;
                    this.vy *= -1;
                }
            }

            // Calculations to identify where the sword asset physically sits in real-time
            getSwordTipPosition() {
                const sx = this.x + Math.cos(this.swordAngle) * this.swordRadius;
                const sy = this.y + Math.sin(this.swordAngle) * this.swordRadius;
                return { x: sx, y: sy };
            }

            takeDamage(amount, sourceX, sourceY) {
                if (this.invulnFrames > 0) return;
                this.hp -= amount;
                if (this.hp < 0) this.hp = 0;

                // Knockback physics vector adjustment away from hazard source
                const dx = this.x - sourceX;
                const dy = this.y - sourceY;
                const dist = Math.hypot(dx, dy) || 1;
                const knockbackForce = 8;
                
                this.vx = (dx / dist) * knockbackForce;
                this.vy = (dy / dist) * knockbackForce;
                this.invulnFrames = 15; // 15 frames of grace time
            }

            draw() {
                ctx.save();

                // 1. Draw Sword (with rotational transformation matrix)
                const swordPos = this.getSwordTipPosition();
                ctx.save();
                ctx.translate(swordPos.x, swordPos.y);
                // Rotate sword context alignment to naturally match outward trajectory radius
                ctx.rotate(this.swordAngle + Math.PI / 2); 
                ctx.drawImage(swordImg, -this.swordWidth / 2, -this.swordHeight / 2, this.swordWidth, this.swordHeight);
                ctx.restore();

                // 2. Draw Tinted Image Context (Flash white/red if invulnerable)
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.clip(); // Mask bounding box into circles matching asset radius size parameters

                ctx.drawImage(charImg, this.x - this.radius, this.y - this.radius, this.radius * 2, this.radius * 2);
                
                // Overlay identifying unique random generation colors using multiply context mix blending
                ctx.globalCompositeOperation = "multiply";
                ctx.fillStyle = this.color;
                ctx.fillRect(this.x - this.radius, this.y - this.radius, this.radius * 2, this.radius * 2);
                ctx.globalCompositeOperation = "source-over";

                if (this.invulnFrames > 0) {
                    ctx.fillStyle = 'rgba(255, 0, 0, 0.4)';
                    ctx.fillRect(this.x - this.radius, this.y - this.radius, this.radius * 2, this.radius * 2);
                }
                ctx.restore();

                // 3. Draw Unique Identifier Border Ring
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.strokeStyle = this.color;
                ctx.lineWidth = 3;
                ctx.stroke();

                // 4. Draw Health Bar Graphic Layout Above Target Headers
                const barWidth = this.radius * 1.5;
                const barHeight = 6;
                const bx = this.x - barWidth / 2;
                const by = this.y - this.radius - 12;

                // Background context wrapper
ctx.fillStyle = '#444';
ctx.fillRect(bx, by, barWidth, barHeight);
// Current remaining dynamic HP metrics
const hpPct = this.hp / this.maxHp;
ctx.fillStyle = hpPct > 0.5 ? '#28a745' : hpPct > 0.2 ? '#ffc107' : '#dc3545';
ctx.fillRect(bx, by, barWidth * hpPct, barHeight);
}
}
// Centralized Collision Detection Matrix Router
function handleCollisions() {
for (let i = 0; i < characters.length; i++) {
let c1 = characters[i];
for (let j = i + 1; j < characters.length; j++) {
let c2 = characters[j];
// --- Character Vector Intersections to Character Vectors ---
const dx = c2.x - c1.x;
const dy = c2.y - c1.y;
const distance = Math.hypot(dx, dy);
const minDistance = c1.radius + c2.radius;
if (distance < minDistance) {
// Push away to prevent stick overlaps
const overlap = minDistance - distance;
const nx = dx / distance;
const ny = dy / distance;
c1.x -= nx * (overlap / 2);
c1.y -= ny * (overlap / 2);
c2.x += nx * (overlap / 2);
c2.y += ny * (overlap / 2);
// Simple Elastic bounce velocity calculations
const kx = c1.vx - c2.vx;
const ky = c1.vy - c2.vy;
const p = 2 * (nx * kx + ny * ky) / 2;
c1.vx -= p * nx;
c1.vy -= p * ny;
c2.vx += p * nx;
c2.vy += p * ny;
}
// --- Direct Hit Sword Check (C1 Sword hits C2 Body) ---
const s1 = c1.getSwordTipPosition();
const distSword1ToC2 = Math.hypot(c2.x - s1.x, c2.y - s1.y);
if (distSword1ToC2 < c2.radius) {
c2.takeDamage(15, c1.x, c1.y);
}
// --- Direct Hit Sword Check (C2 Sword hits C1 Body) ---
const s2 = c2.getSwordTipPosition();
const distSword2ToC1 = Math.hypot(c1.x - s2.x, c1.y - s2.y);
if (distSword2ToC1 < c1.radius) {
c1.takeDamage(15, c2.x, c2.y);
}
}
}
}
// Spawn Handler tracking current Snapshot values from the input fields
spawnBtn.addEventListener('click', () => {
const speed = parseFloat(speedInput.value) || 4;
const size = parseFloat(sizeInput.value) || 30;
const maxHp = parseFloat(hpInput.value) || 100;
// Spawn safely away from the absolute edges
const x = Math.max(size, Math.min(canvas.width - size, Math.random() * canvas.width));
const y = Math.max(size, Math.min(canvas.height - size, Math.random() * canvas.height));
characters.push(new Character(x, y, speed, size, maxHp));
});
// Wipes all clones instantly
clearBtn.addEventListener('click', () => {
characters = [];
});
// Continuous Loop
function gameLoop() {
ctx.clearRect(0, 0, canvas.width, canvas.height);
// Filter out dead characters before updating/drawing
characters = characters.filter(c => c.hp > 0);
// Core lifecycle execution sequencing
handleCollisions();
characters.forEach(c => {
c.update();
c.draw();
});
requestAnimationFrame(gameLoop);
}
// Start processing frame instances
gameLoop();
