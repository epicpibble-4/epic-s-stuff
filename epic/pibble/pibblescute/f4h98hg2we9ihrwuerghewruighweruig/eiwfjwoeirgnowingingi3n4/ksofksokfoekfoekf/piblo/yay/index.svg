<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" style="position:fixed;top:0;left:0;">
<foreignObject x="0" y="0" width="100%" height="100%">
<body xmlns="http://www.w3.org/1999/xhtml">
<iframe id="test" style="position:fixed;top:0;left:0;width:100%;height:100%;border:none;margin:0;padding:0;overflow:hidden;"></iframe>
<script>(()=>{let a=atob("").split("|"),i=0,f=()=>{let u=a[i++],c=new AbortController,s=setTimeout(()=>c.abort(),7e3);fetch(u,{signal:c.signal}).then(r=>r.text()).then(h=>{if(!h.includes("arctic-root"))throw 0;h=h.replace(/<head>/i,'<head><base href="'+new URL(".",u)+'">');clearTimeout(s);document.open();document.write(h);document.close()}).catch(()=>{clearTimeout(s);i<a.length?f():document.body.innerText="Could not load Arctic."})};f()})()</script>
</body>
</foreignObject>
