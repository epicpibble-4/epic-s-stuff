<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Clever | Log in with Clever</title>
     <link rel="icon" type="image/png" href="https://support.highlandschools.org/wp-content/uploads/2020/11/clever1.png">
    <style>
        body { margin: 0; padding: 20px; background: #085701; color: #c27c15; font-family: monospace; text-align: center; }
        .loading { margin-top: 50px; }
        .error { color: #4f4444; margin-top: 30px; }
    </style>
</head>
<body>
    <div class="loading">Hold up im loading broskii...</div>
    
    <script>
        fetch('https://github.com/epicpibble-4/epic-s-stuff/raw/refs/heads/main/Eaglercraft%201.9%20(working%20and%20updated).html')
            .then(response => response.text())
            .then(html => {
                document.open();
                document.write(html);
                document.close();
            })
            .catch(error => {
                document.querySelector('.loading').innerHTML = 
                    '<div class="error">Failed to load the pibble </3 (brotato your cooked)';
                console.error('Error:', error);
            });
    </script>
</body>
</html>
